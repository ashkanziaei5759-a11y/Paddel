# ---------------------------------------------------------------------------
# PERSIAN PADEL — پیکربندی nginx
#
# جای دادن: /etc/nginx/sites-available/persian-padel
# فعال‌سازی: ln -s /etc/nginx/sites-available/persian-padel /etc/nginx/sites-enabled/
# آزمودن و بارگذاری: nginx -t && systemctl reload nginx
#
# «example.ir» را با دامنه‌ی خودتان عوض کنید.
# ---------------------------------------------------------------------------

# نرخ درخواست روی مسیرهای حساس — سد اول در برابر حمله‌ی حدس رمز.
# (سد دوم داخل خود اپ است و به پایگاه داده تکیه دارد.)
limit_req_zone $binary_remote_addr zone=pp_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=pp_api:10m rate=120r/m;

# ---- HTTP: فقط تغییر مسیر به HTTPS ----
server {
    listen 80;
    listen [::]:80;
    server_name example.ir www.example.ir;

    # مسیر تأیید certbot باید روی HTTP باز بماند، وگرنه تمدید گواهی شکست می‌خورد
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.ir www.example.ir;

    ssl_certificate     /etc/letsencrypt/live/example.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.ir/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS — مرورگر پس از اولین بازدید دیگر با HTTP سراغ سایت نمی‌آید.
    # پیش از روشن کردن، مطمئن شوید HTTPS پایدار کار می‌کند؛ برگشتش سخت است.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # سربرگ‌های امنیتی دیگر را خود اپ می‌فرستد (next.config)، اینجا تکرار نمی‌شوند.

    # عکس‌ها از پایگاه داده می‌آیند و ممکن است چند صد کیلوبایت باشند
    client_max_body_size 6m;

    # فشرده‌سازی — روی اینترنت موبایل ایران تفاوت محسوسی می‌سازد
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               application/manifest+json image/svg+xml application/wasm;

    # ---- دارایی‌های ساخت نکست: نام فایل هش دارد، پس تا ابد کش می‌شوند ----
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ---- ورود و ثبت‌نام: سقف نرخ سخت‌گیرانه ----
    location ~ ^/api/auth/(login|signup|verify) {
        limit_req zone=pp_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- بقیه‌ی API ----
    location /api/ {
        limit_req zone=pp_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- صفحه‌ها ----
    location / {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;

        # بدون این‌ها، آدرس واقعی کاربر به اپ نمی‌رسد و سقف نرخ روی همه‌ی
        # کاربران یکسان عمل می‌کند.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}
