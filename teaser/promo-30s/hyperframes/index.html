<!doctype html>
<html lang="fa">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Dana"; src: url("assets/fonts/Dana-Regular.woff2") format("woff2"); font-weight: 400; }
      @font-face { font-family: "Dana"; src: url("assets/fonts/Dana-Bold.woff2") format("woff2"); font-weight: 700; }
      :root { --ground: #1C2D7D; --deep: #0F1A52; --ink: #ffffff; --lime: #D9E021; --font-display: "Dana", sans-serif; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 100%; height: 100%; font-family: var(--font-display); color: var(--ink); direction: rtl;
        background: radial-gradient(1200px 900px at 50% 45%, #2B3FA0 0%, var(--ground) 45%, var(--deep) 100%); }
      .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
      #credit-kicker { display: flex; align-items: center; gap: 22px; font-size: 34px; font-weight: 700; color: var(--lime); }
      #credit-kicker i { display: block; width: 70px; height: 5px; border-radius: 3px; background: var(--lime); }
      #credit-title { font-size: 92px; font-weight: 700; margin-top: 26px; line-height: 1.3; text-align: center; }
      #credit-sub { font-size: 40px; margin-top: 22px; color: rgba(255,255,255,.82); text-align: center; }
      #credit-pair { display: flex; align-items: center; gap: 60px; margin-top: 70px; direction: ltr; }
      #credit-pair img.pp { height: 120px; }
      #credit-pair img.am { height: 150px; }
      #credit-x { font-size: 64px; color: var(--lime); font-weight: 400; }
      #end-logo { width: 1180px; }
      #end-line { margin-top: 30px; font-size: 36px; color: rgba(255,255,255,.85); }
      #flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <div id="credit" class="clip center" data-start="0" data-duration="3.1" data-track-index="0">
        <div id="credit-in" class="center">
          <div id="credit-kicker"><i></i><span data-var-text="kicker">طراحی و توسعه‌ی اختصاصی</span><i></i></div>
          <div id="credit-title" data-var-text="title">ساخته‌شده توسط آماریا برای پرشین پدل</div>
          <div id="credit-sub" data-var-text="sub">نرم‌افزار تخصصی رزرو زمین و مدیریت باشگاه</div>
          <div id="credit-pair">
            <img class="pp" src="assets/pp-logo.png" alt="Persian Padel" />
            <span id="credit-x">×</span>
            <img class="am" src="assets/amariya.png" alt="Amariya" />
          </div>
        </div>
      </div>
      <div id="end" class="clip center" data-start="3.0" data-duration="3" data-track-index="1">
        <div id="end-in" class="center">
          <img id="end-logo" src="assets/amariya.png" alt="Amariya" />
          <div id="end-line" data-var-text="endline">آماریا — طراح و سازنده‌ی نرم‌افزار پرشین پدل</div>
        </div>
      </div>
      <div id="flash" class="clip" data-start="2.9" data-duration="0.5" data-track-index="2"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#credit-kicker", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.05);
      tl.fromTo("#credit-title", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.2);
      tl.fromTo("#credit-sub", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.4);
      tl.fromTo("#credit-pair", { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.7, ease: "back.out(1.6)" }, 0.6);
      tl.fromTo("#credit-in", { opacity: 1, scale: 1 }, { opacity: 0, scale: 1.06, duration: 0.35, ease: "power2.in" }, 2.7);
      tl.fromTo("#flash", { opacity: 0 }, { opacity: 0.35, duration: 0.12, ease: "none" }, 2.95);
      tl.fromTo("#flash", { opacity: 0.35 }, { opacity: 0, duration: 0.3, ease: "power2.out" }, 3.07);
      tl.fromTo("#end-logo", { opacity: 0, scale: 0.7, clipPath: "inset(100% 0 0 0)" }, { opacity: 1, scale: 1, clipPath: "inset(0% 0 0 0)", duration: 0.9, ease: "expo.out" }, 3.0);
      tl.fromTo("#end-line", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 3.6);
      tl.fromTo("#end-in", { scale: 1 }, { scale: 1.04, duration: 2.4, ease: "sine.inOut" }, 3.5);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
